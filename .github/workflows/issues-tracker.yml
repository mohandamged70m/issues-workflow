name: Fresh Issues Tracker

on:
  schedule:
    - cron: "0 */6 * * *"  # every 6 hours
  workflow_dispatch:  # manual Run workflow button

permissions:
  contents: write

jobs:
  find-and-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Find fresh top-10 issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python scripts/find_issues.py

      - name: Commit updated state
        run: |
          git config user.name "issues-bot"
          git config user.email "issues-bot@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "chore: update seen issues [skip ci]"
          git push
